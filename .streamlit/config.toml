# Thème de l'application (Séance 2 : la couleur sert l'information).
# primaryColor = bleu Okabe-Ito plutôt que le rouge par défaut de Streamlit
# (rouge = alerte, et opposition rouge/vert à éviter). L'orange #E69F00 reste
# réservé à la mise en évidence dans les graphiques ; en couleur d'interface,
# il aurait aussi donné un texte peu contrasté sur fond blanc (2,2:1, contre
# 5,3:1 pour ce bleu).
[theme]
base = "light"
primaryColor = "#0072B2"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F6F8"
textColor = "#262626"
