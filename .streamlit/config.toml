# Couleur d'accent des widgets Streamlit alignée sur la palette (src/theme.py) :
# le rouge par défaut de Streamlit entrerait en concurrence avec les couleurs
# des pays et avec la couleur d'alerte.
[theme]
base = "light"
primaryColor = "#0072B2"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F7FA"
textColor = "#262626"
